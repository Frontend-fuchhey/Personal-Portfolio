[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Ensure proper MIME types and download headers for mobile and document assets
[[headers]]
  for = "/downloads/*.mobileconfig"
  [headers.values]
    Content-Type = "application/x-apple-aspen-config; charset=utf-8"
    Content-Disposition = "attachment; filename=\"ShrawanOS.mobileconfig\""

[[headers]]
  for = "/downloads/*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"ShrawanOS.apk\""

[[headers]]
  for = "/Shrawan_karki_CV.pdf"
  [headers.values]
    Content-Type = "application/pdf"
    Content-Disposition = "attachment; filename=\"Shrawan_karki_CV.pdf\""

# SPA fallback: route all other paths to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
